; armoverhaul plugin values: the original mod's settings (sby's armOverhaulV1). Edit and restart the game.
; Numbers only; keys are the mod's own names.

[positions]
; Where each new arm position puts her hand: x / y offsets (pixels) and the hand's rotation (degrees).
onHipsXOffsetLeft=60  ; Left hand x coordinate
onHipsYOffsetLeft=431  ; Left hand y coordinate
onHipsRotationLeft=-50  ; Left hand rotation (degrees)
onHipsXOffsetRight=45  ; Right hand x coordinate
onHipsYOffsetRight=350  ; Right hand y coordinate
onHipsRotationRight=-50  ; Right hand rotation (degrees)
onNeckMoveWithBulge=1  ; 1=on, hands rotate to follow neck bulge
onNeckDrawPoint=15  ; Position on neck used to determine neck bulge for calculations, 0-29 (0 = highest on neck)
onNeckDrawPointRate=0.18  ; Scalar used in determining amount of rotation as function of bulge size
onNeckXOffsetLeft=240
onNeckYOffsetLeft=105
onNeckRotationLeft=-210
onNeckXOffsetRight=250
onNeckYOffsetRight=0
onNeckRotationRight=-210
inFaceXOffsetLeft=345
inFaceYOffsetLeft=175
inFaceRotationLeft=-180
inFaceXOffsetRight=320
inFaceYOffsetRight=70
inFaceRotationRight=-170
holdingStomachBreathingRate=4.5  ; Scalar used in attempt to match x coordinates of her hands with her breathing
holdingStomachExpansionRate=1.55  ; Scalar used in attempt to match coords of her hands with stomach expansion size
holdingStomachXOffsetLeft=105  ; (When using BreastExpPlus_v3_7)
holdingStomachYOffsetLeft=240
holdingStomachRotationLeft=-45
holdingStomachXOffsetRight=90
holdingStomachYOffsetRight=150
holdingStomachRotationRight=-35
cuppingBallsUnderLeg=1  ; 1=on, moves his leg layer to the front when position is selected for right arm
cuppingBallsYOffsetScaleFactor=45  ; Scalar used in attempt to match y coordinates of her hands with balls size
cuppingBallsRotationScaleFactor=45  ; Scalar used in attempt to match rotation of hands with balls size
cuppingBallsXOffsetLeft=-30
cuppingBallsYOffsetLeft=-135
cuppingBallsRotationLeft=-165
cuppingBallsXOffsetRight=-20
cuppingBallsYOffsetRight=-145
cuppingBallsRotationRight=-165
onHisAssUnderLeg=1  ; 1=on, moves his leg layer to the front when position is selected for right arm
onHisAssXOffsetLeft=280
onHisAssYOffsetLeft=150
onHisAssRotationLeft=-180
onHisAssXOffsetRight=280
onHisAssYOffsetRight=70
onHisAssRotationRight=-180
inHisHandHoldAfterPassout=1  ; 1=on, arm will stay in this position after passout instead of dropping
inHisHandXOffsetRight=30
inHisHandYOffsetRight=90
inHisHandRotationRight=-90
inHisHandFemaleXOffset=20  ; Same settings as usual but for the case of using a female him body
inHisHandFemaleYOffset=150
inHisHandFemaleRotation=-65
holdingHandHoldAfterPassout=0  ; 1=on, arm will stay in this position after passout instead of dropping
holdingHandXOffsetRight=30
holdingHandYOffsetRight=90
holdingHandRotationRight=-90
holdingHandFemaleXOffset=0
holdingHandFemaleYOffset=130
holdingHandFemaleRotation=-75
onHisHandXOffsetLeft=150
onHisHandYOffsetLeft=230
onHisHandRotationLeft=-220

[in_air]
; In Air: her hands move between a min and a max position as a percentage rises and falls.
inAirXMinLeft=135  ; In Air uses min and max values for offsets + rotation to set a range of movement.
inAirXMaxLeft=335  ; Arm movement is based on a tracked percentage that increases and decreases based on
inAirYMinLeft=-180  ; certain factors given below
inAirYMaxLeft=180
inAirRotationMinLeft=-80
inAirRotationMaxLeft=-170
inAirXMinRight=110
inAirXMaxRight=310
inAirYMinRight=-270
inAirYMaxRight=70
inAirRotationMinRight=-70
inAirRotationMaxRight=-160
inAirCurveExponent=0.6  ; Exponent used in movement of arms, 1=linear, <1=faster at start, >1=faster at end
inAirLoss=0.005  ; Loss per frame
inAirRandomLossFactor=0.99  ; Multiplier applied to percentage on random loss (used to create jittering effect)
inAirRandomLossChance=0.15  ; Chance per frame of triggering random loss
inAirRandomGainFactor=1.01  ; Multiplier applied to percentage on random gain (used to create jittering effect)
inAirRandomGainChance=0.1  ; Chance per frame of triggering random gain
inAirVigorGain=0.009  ; Gain per frame multiplied by vigor percent
inAirNoBreathingGain=0.0049  ; Gain per frame when not breathing
inAirPassoutGain=0.005  ; Gain per frame multiplied by passout percent
inAirCoughGain=0.05  ; Gain on cough
inAirWakeMinGain=0.1  ; Min gain on wake
inAirWakeMaxGain=0.9  ; Max gain on wake

[masturbating]
; Masturbating: the speed of her hand.
minMasSpeed=0.05  ; Minimum masturbating speed
maxMasSpeed=0.65  ; Maximum masturbating speed
vigorMasSpeed=0.0025  ; Increase in speed per frame multiplied by vigor percent
hjPleasureMasSpeed=0.00025  ; Increase in speed per pleasure given by handjob
passOutMasSpeed=0.004  ; Increase in speed per frame multiplied by function of passout percent
passOutMasSpeedPeak=0.7  ; Passout percentage at which speed gain is highest and begins to decrease (0.7=30% left)
wakeMasSpeedMin=0.3  ; Min random mas speed gain on wake
wakeMasSpeedMax=0.5  ; Max random mas speed gain on wake
passiveMasSpeedLoss=0.001  ; Decrease in speed per frame
randomMasEnableThreshold=0.1  ; Masturbation speed under which random masturbating speed boost triggers
randomMasMinSpeed=0.2  ; Min random mas speed
randomMasMaxSpeed=0.4  ; Max random mas speed
randomMasMinInterval=400  ; Min frames between random masturbation speed boost trigger
randomMasMaxInterval=500  ; Max frames between random masturbation speed boost trigger
randomMasMinDuration=200  ; Min frames of random masturbation speed boost
randomMasMaxDuration=400  ; Max frames of random masturbation speed boost
breathLossAmount=0.2  ; Loss of breath, multiplied by percent of current mas speed

[slip]
; Ticks her arm takes to drop from each new position when she passes out (higher = slower).
cuppingBreastSlipTime=10
holdingBreastSlipTime=10
onHisWaistSlipTime=20
onHisChestSlipTime=5
grippingBreastSlipTime=30
grippingThighSlipTime=15
onHerAssSlipTime=15
onHipsSlipTime=30
onNeckSlipTime=20
inFaceSlipTime=1
inAirSlipTime=25
holdingStomachSlipTime=20
cuppingBallsSlipTime=20
onHisAssSlipTime=10
onHisHandSlipTime=1
masturbatingSlipTime=10
inHisHandSlipTime=5
holdingHandSlipTime=5

[transitions]
; Arms moving between positions (hotkeys).
transitionMass=12  ; Frames taken for arms to move between positions
transitionHandMass=10  ; Frames taken for hands to rotate to new positions
backTransitionPosition=13  ; 0-23, when changing to back, intermediate arm position to move to before setting to back
fromBackTransitionPosition=6  ; 0-23, when changing from back, arm position to start at before moving to new position
backTransitionSpeed=2  ; When changing to back, frames left in transition at which arms will set to back
hotkeyTransitions=1  ; Enables transitions for arm changes from hotkeys
[keys]
; Keys that put her arm in a position: the mod's names (left / right, the position without spaces, Keys), Flash key
; codes separated by commas, e.g. leftOnHipsKeys="72,74". Only while "Arm hotkeys" is on.
leftMasturbatingKeys="76"  ; L
rightInHisHandKeys="86"  ; V
