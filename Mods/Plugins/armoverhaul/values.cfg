[dynamic_arms]
; Dynamic arms: every position has a positive, a negative and a neutral weight per arm; what happens
; adds to them ("+" positive, "*" neutral, "-" negative), they decay every tick, and an arm goes to the
; heaviest one. The moods' factors (sections [mood_...]) scale each kind.
dynamicArms=1  ; 1=on, sets dynamic arms active on start
disableDynamicArmsForNonOral=1  ; 1=on, disables dynamic arms when in a non oral position
dynamicArmsTransitions=1  ; 1=on, animates arms moving between positions (as opposed to snapping between positions)
disableNonTransitions=1  ; 1=on, disable changes between positions that look particulary awkward (list on undertow)
debugMode=0  ; 1=on, lists both arms' pos/weight/type at regular intervals
debugRefresh=20  ; Frames between each debug message
minimumCooldown=20  ; Minimum frames between each arm change
minimumWeightThreshold=2  ; Minimum weight needed to trigger arm changes
extraLooseWeightDecay=0.995  ; <=1, extra multiplier applied per frame to loose weight (so position changes more quickly)
extraInFaceWeightDecay=0.995  ; <=1, extra multiplier applied per frame to in face weights
extraHandJobNegativeWeightDecay=0.995  ; <=1, extra multiplier applied per frame to hand job negative weight
randomFactor=0.5  ; 0-1, randomness applied when adding/subtracting weights, 0=no randomness, 1=2x randomness
armCorrelation=0.6  ; 0-1, how close weights added/subtracted are for each arm, 0=no correlation, 1=same weights
extraWeightOnTransition=8  ; Extra weight added to next position on change
